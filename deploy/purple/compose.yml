name: ds-asv-portal

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: asv_portal
      POSTGRES_USER: asv
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD}
    volumes:
      - portal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asv -d asv_portal"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    image: postgres:17-bookworm
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: asv_portal
      PGUSER: asv
      PGPASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 <<SQL
        DO \$\$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'asv_app') THEN
            CREATE ROLE asv_app LOGIN PASSWORD '$$APP_DB_PASSWORD';
          ELSE
            ALTER ROLE asv_app LOGIN PASSWORD '$$APP_DB_PASSWORD';
          END IF;
        END
        \$\$;
        GRANT CONNECT ON DATABASE asv_portal TO asv_app;
        SQL

  keycloak-db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${PUBLIC_HOST:?set PUBLIC_HOST}/auth
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro

  portal:
    build:
      context: ../../portal
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    environment:
      APP_MODE: prod
      DATABASE_URL: postgresql://asv_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/asv_portal
      ADMIN_DATABASE_URL: postgresql://asv:${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD}@db:5432/asv_portal
      MANIFEST_SECRET: ${MANIFEST_SECRET:?set MANIFEST_SECRET}
      # Where to dispatch scan manifests. Without this the portal
      # falls back to http://localhost:8000 inside its own container,
      # so scans are accepted then never reach the scanner.
      SCANNER_BASE_URL: http://scanner-api:8000
      KEYCLOAK_ISSUER: https://${PUBLIC_HOST:?set PUBLIC_HOST}/auth/realms/asv-portal
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/auth/realms/asv-portal
      KEYCLOAK_CLIENT_ID: asv-portal
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET}
      PUBLIC_ORIGIN: https://${PUBLIC_HOST:?set PUBLIC_HOST}
      STAFF_ROLE: asv-staff
      STAFF_USER_IDS: ""
    expose:
      - "3000"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
    depends_on:
      portal:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./app-dist:/usr/share/nginx/html/app:ro
      - ./scanner-dist:/usr/share/nginx/html/scanner:ro

volumes:
  portal-db:
  keycloak-db:
  keycloak-data:
