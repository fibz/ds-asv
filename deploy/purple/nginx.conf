events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server {
    listen 8443 ssl;
    server_name 74.156.0.13;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /auth/ {
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /app {
      return 301 /app/;
    }

    location = /app/index.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-store";
    }

    location /app/ {
      root /usr/share/nginx/html;
      try_files $uri /app/index.html;
    }

    location = /scanner {
      return 301 /scanner/;
    }

    location = /scanner/index.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-store";
    }

    # No $uri/ branch: a directory under the web root must never match a
    # route (that is what returned 403 for /app/assets).
    location /scanner/ {
      root /usr/share/nginx/html;
      try_files $uri /scanner/index.html;
    }

    # The scanner API. Root-absolute /v1/ - deliberately not /api/v1/,
    # which the portal owns.
    location /v1/ {
      proxy_pass http://scanner-api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://portal:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
