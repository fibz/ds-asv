# Integration-test postgres for the ASV scanner (Phase 8b restore).
# Consumed by `make test-integration`; torn down with `down -v` after the suite.
# The default credentials are local-only placeholders (GitHub-scan-safe);
# override every value via env when pointing at a shared instance.
#
#   docker compose -f tests/fixtures/docker-compose.yml up -d --wait
#   ASV_IT_DATABASE_URL=postgresql+psycopg2://asv_it:CHANGE_ME@127.0.0.1:54329/asv_scanner_it \
#     .venv/bin/pytest tests/integration/ -v
name: asv-scanner-it

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ASV_IT_PG_DB:-asv_scanner_it}
      POSTGRES_USER: ${ASV_IT_PG_USER:-asv_it}
      POSTGRES_PASSWORD: ${ASV_IT_PG_PASSWORD:-CHANGE_ME}
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ASV_IT_PG_USER:-asv_it} -d ${ASV_IT_PG_DB:-asv_scanner_it}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - asv-it-pgdata:/var/lib/postgresql/data

volumes:
  asv-it-pgdata: